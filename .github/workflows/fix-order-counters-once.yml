name: Fix order counters once

on:
  push:
    paths:
      - '.github/workflows/fix-order-counters-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Corrigir contadores dos pedidos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = """        function renderizarPedidos() {
            const container = document.getElementById('lista-pedidos-container');
            const pedidos = pedidosAtuais.filter(p => {
                const statusOk = filtroPedidos === 'todos' || Number(p.status) === Number(filtroPedidos);
                const termo = termoBuscaPedidos;
                const termoOk = !termo || [
                    p.cliente_nome,
                    p.cliente_telefone,
                    String(p.id)
                ].some(valor => String(valor || '').toLowerCase().includes(termo));

                const dataOk = pedidosNoPeriodo(p.criado_em);

                return statusOk && termoOk && dataOk;
            });
"""

          new = """        function renderizarPedidos() {
            const container = document.getElementById('lista-pedidos-container');

            // Primeiro aplica os filtros gerais da tela (data + busca).
            // Os contadores precisam usar exatamente esse mesmo universo de pedidos;
            // antes eles contavam TODO o histórico do banco, mesmo quando a tela estava em \"Hoje\".
            const pedidosNoEscopo = pedidosAtuais.filter(p => {
                const termo = termoBuscaPedidos;
                const termoOk = !termo || [
                    p.cliente_nome,
                    p.cliente_telefone,
                    String(p.id)
                ].some(valor => String(valor || '').toLowerCase().includes(termo));

                const dataOk = pedidosNoPeriodo(p.criado_em);
                return termoOk && dataOk;
            });

            atualizarContadoresPedidos(pedidosNoEscopo);

            // Depois aplica somente a etapa selecionada (Novos, Em preparo, etc.).
            const pedidos = pedidosNoEscopo.filter(p =>
                filtroPedidos === 'todos' || Number(p.status) === Number(filtroPedidos)
            );
"""

          if old not in text:
              raise SystemExit('Trecho esperado de renderizarPedidos não foi encontrado; nenhuma alteração foi feita.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commitar correção e remover workflow temporário
        shell: bash
        run: |
          rm -f .github/workflows/fix-order-counters-once.yml
          git config user.name "ChatGPT Fix"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/fix-order-counters-once.yml
          git commit -m "fix: make order counters respect active filters"
          git push
